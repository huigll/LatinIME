android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# AddressSanitizer (ASAN) for JNI memory debugging. Enable to detect buffer overflows,
# use-after-free, etc. Default OFF - set to true and rebuild to enable.
# Usage: ./gradlew assembleDebug -Platinime.enableAsan=true
#        ./gradlew connectedDebugAndroidTest -Platinime.enableAsan=true  # ASAN in tests too
#        (Windows PowerShell: .\gradlew.bat assembleDebug "-Platinime.enableAsan=true")
# Runtime: requires API 27+ and useLegacyPackaging. See keyboard/build.gradle ASAN setup.
latinime.enableAsan=false
