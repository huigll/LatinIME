apply plugin: 'com.android.application'

def enableAsan = project.findProperty('latinime.enableAsan') ?: 'false'
def asanEnabled = enableAsan.toString().toLowerCase() == 'true'

android {
    namespace 'com.android.inputmethod.latin.app'
    testNamespace 'com.android.inputmethod.latin.tests'
    compileSdkVersion 34

    // Required if using classes in android.test.runner
    useLibrary 'android.test.runner'

    // Required if using classes in android.test.base
    useLibrary 'android.test.base'

    // Required if using classes in android.test.mock
    useLibrary 'android.test.mock'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionName "1.0"

        applicationId 'com.android.inputmethod.latin'
        testApplicationId 'com.android.inputmethod.latin.tests'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = false

        signingConfig signingConfigs.debug

    }

    signingConfigs {
        debug {
            storeFile file("../java/shared.keystore")
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // ASAN requires useLegacyPackaging for wrap.sh to work (API 27+)
            if (asanEnabled) {
                packagingOptions {
                    jniLibs {
                        useLegacyPackaging = true
                    }
                }
            }
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../java/proguard.flags'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions "default"


    lintOptions {
        checkReleaseBuilds false
    }

    aaptOptions {
        noCompress 'dict', 'dat'
    }

}

// ASAN setup: wrap.sh + libclang_rt.asan-*.so from NDK. Ref: working project with
// preBuild.doFirst, custom wrap.sh (ASAN_OPTIONS, ls for lib), jniLibs, cleanup when disabled.
project.afterEvaluate {
    def projectDir = project.projectDir.toString()
    def mainResLib = file("${projectDir}/src/main/resources/lib")
    def mainJniLibs = file("${projectDir}/src/main/jniLibs")
    def abis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
    def archMap = ['arm64-v8a': 'aarch64', 'armeabi-v7a': 'arm', 'x86_64': 'x86_64']

    preBuild.doFirst {
        if (asanEnabled) {
            def ndkDir = android.ndkDirectory?.absolutePath ?: System.getenv('ANDROID_NDK_HOME')
            if (!ndkDir) {
                logger.warn('LatinIME ASAN: NDK path not found. Set ANDROID_NDK_HOME or ensure NDK is installed.')
                return
            }
            def ndkLibDir = ndkDir + "/toolchains/llvm/prebuilt/"

            abis.each { abi ->
                def arch = archMap[abi] ?: abi
                def resDir = new File(mainResLib, abi)
                resDir.mkdirs()
                def jniDir = new File(mainJniLibs, abi)
                jniDir.mkdirs()

                // Find and copy ASAN lib via FileTree (ref: working project)
                def foundForAbi = false
                fileTree(dir: ndkLibDir).include("**/libclang_rt.asan-${arch}-android.so").each { File asanFile ->
                    foundForAbi = true
                    copy { from asanFile; into jniDir }
                    logger.lifecycle("LatinIME ASAN: [${abi}] copy lib ${asanFile.name} -> ${jniDir}")
                }

                if (foundForAbi) {
                    // Create custom wrap.sh (ref: working project - ls finds lib in same dir in APK)
                    def wrapFile = new File(resDir, "wrap.sh")
                    wrapFile.withWriter { writer ->
                        writer.write('#!/system/bin/sh\n')
                        writer.write('HERE="$(cd "$(dirname "$0")" && pwd)"\n')
                        writer.write('export ASAN_OPTIONS=log_to_syslog=false,allow_user_segv_handler=1,detect_stack_use_after_return=1,check_initialization_order=true,quarantine_size_mb=64,color=never,new_delete_type_mismatch=0,sleep_before_dying=5,use_sigaltstack=0\n')
                        writer.write("ASAN_LIB=\$(ls \$HERE/libclang_rt.asan-${arch}-android.so 2>/dev/null)\n")
                        writer.write('if [ -f "$HERE/libc++_shared.so" ]; then\n')
                        writer.write('  export LD_PRELOAD="$ASAN_LIB $HERE/libc++_shared.so"\n')
                        writer.write('else\n')
                        writer.write('  export LD_PRELOAD="$ASAN_LIB"\n')
                        writer.write('fi\n')
                        writer.write('exec "$@"\n')
                    }
                    logger.lifecycle("LatinIME ASAN: [${abi}] create wrap.sh: ${wrapFile.absolutePath}")
                } else {
                    logger.lifecycle("LatinIME ASAN: [${abi}] libclang_rt.asan-${arch}-android.so not in NDK; using static ASAN")
                }
            }
            // When static ASAN (no dynamic lib found), remove wrap.sh and empty jniLibs
            def hasAnyAsanLib = abis.any { abi ->
                new File(mainJniLibs, abi).listFiles()?.any { it.name.startsWith("libclang_rt.asan") } ?: false
            }
            if (!hasAnyAsanLib) {
                if (mainResLib.exists()) mainResLib.deleteDir()
                if (mainJniLibs.exists()) mainJniLibs.deleteDir()
            }
        } else {
            if (mainResLib.exists()) mainResLib.deleteDir()
            if (mainJniLibs.exists()) mainJniLibs.deleteDir()
        }
    }
}

clean.doFirst {
    def mainResLib = file("${projectDir}/src/main/resources/lib")
    def mainJniLibs = file("${projectDir}/src/main/jniLibs")
    if (mainResLib.exists()) mainResLib.deleteDir()
    if (mainJniLibs.exists()) mainJniLibs.deleteDir()
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation project(':keyboard')

    testImplementation 'junit:junit:4.12'
    androidTestImplementation "org.mockito:mockito-core:1.9.5"
    androidTestImplementation 'com.google.dexmaker:dexmaker:1.2'
    androidTestImplementation 'com.google.dexmaker:dexmaker-mockito:1.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    androidTestImplementation 'androidx.annotation:annotation:1.6.0'
}
