apply plugin: 'com.android.application'

def enableAsan = project.findProperty('latinime.enableAsan') ?: 'false'
def asanEnabled = enableAsan.toString().toLowerCase() == 'true'

android {
    namespace 'com.android.inputmethod.latin'
    testNamespace 'com.android.inputmethod.latin.tests'
    compileSdkVersion 34

    // Required if using classes in android.test.runner
    useLibrary 'android.test.runner'

    // Required if using classes in android.test.base
    useLibrary 'android.test.base'

    // Required if using classes in android.test.mock
    useLibrary 'android.test.mock'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionName "1.0"

        applicationId 'com.android.inputmethod.latin'
        testApplicationId 'com.android.inputmethod.latin.tests'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = false

        signingConfig signingConfigs.debug

    }

    signingConfigs {
        debug {
            storeFile file("../java/shared.keystore")
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // ASAN requires useLegacyPackaging for wrap.sh to work (API 27+)
            if (asanEnabled) {
                packagingOptions {
                    jniLibs {
                        useLegacyPackaging = true
                    }
                }
            }
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../java/proguard.flags'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions "default"


    lintOptions {
        checkReleaseBuilds false
    }

    aaptOptions {
        noCompress 'dict', 'dat'
    }

}

// Copy ASAN runtime (wrap.sh + libclang_rt.asan-*.so) from NDK when ASAN is enabled
if (asanEnabled) {
    def asanJniDir = file("$buildDir/asanJniLibs")
    task setupAsanRuntime {
        outputs.dir asanJniDir
        doLast {
            def ndkDir = android.ndkDirectory?.absolutePath ?: System.getenv('ANDROID_NDK_HOME')
            if (!ndkDir) {
                logger.warn('LatinIME ASAN: NDK path not found. Set ANDROID_NDK_HOME or ensure NDK is installed.')
                return
            }
            def asanSh = file("$ndkDir/wrap.sh/asan.sh")
            if (!asanSh.exists()) {
                logger.warn("LatinIME ASAN: wrap.sh not found at $asanSh")
                return
            }
            def abis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
            def archMap = ['arm64-v8a': 'aarch64', 'armeabi-v7a': 'arm', 'x86_64': 'x86_64']
            def prebuilt = file("$ndkDir/toolchains/llvm/prebuilt")
            def hostDir = prebuilt?.listFiles()?.find { it.isDirectory() }
            def linuxDir = hostDir ? file("$hostDir/lib64/clang").listFiles()?.findResult { ver ->
                def d = file("$ver/lib/linux")
                return d.exists() ? d : null
            } : null
            // wrap.sh must be in src/main/resources/lib/<abi>/ per Android doc
            def mainResLib = file("${projectDir}/src/main/resources/lib")
            abis.each { abi ->
                def resDir = file("$mainResLib/$abi")
                resDir.mkdirs()
                project.copy {
                    from asanSh
                    into resDir
                    rename 'asan.sh', 'wrap.sh'
                }
                def arch = archMap[abi] ?: abi
                def asanSo = linuxDir ? file("$linuxDir/libclang_rt.asan-$arch-android.so") : null
                if (asanSo?.exists()) {
                    def jniDir = file("$asanJniDir/$abi")
                    jniDir.mkdirs()
                    project.copy { from asanSo; into jniDir }
                } else {
                    logger.lifecycle("LatinIME ASAN: libclang_rt.asan-$arch-android.so not in NDK; may use static ASAN.")
                }
            }
        }
    }
    android.sourceSets.debug.jniLibs.srcDirs += asanJniDir
    tasks.whenTaskAdded { task ->
        if (task.name == 'mergeDebugJniLibFolders' || task.name == 'mergeDebugResources') {
            task.dependsOn setupAsanRuntime
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation project(':keyboard')

    testImplementation 'junit:junit:4.12'
    androidTestImplementation "org.mockito:mockito-core:1.9.5"
    androidTestImplementation 'com.google.dexmaker:dexmaker:1.2'
    androidTestImplementation 'com.google.dexmaker:dexmaker-mockito:1.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    androidTestImplementation 'androidx.annotation:annotation:1.6.0'
}
